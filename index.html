<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>스도쿠 · Quiet Grid</title><meta name="description" content="네 가지 난이도로 즐기는 스도쿠. 메모, 되돌리기, 자동 저장으로 나만의 속도로 플레이하세요."><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23315fde'/%3E%3Cpath d='M7 7h7v7H7zm11 0h7v7h-7zM7 18h7v7H7z' fill='white'/%3E%3Cpath d='M18 18h7v7h-7z' fill='%23a9c1ff'/%3E%3C/svg%3E"><style>:root{color-scheme:light;--bg:#f5f7fc;--ink:#243753;--muted:#77859c;--blue:#315fde;--line:#d6dfed;--strong:#405476;font-family:Inter,"Segoe UI","Noto Sans KR",Arial,sans-serif;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);min-height:100dvh}button{font:inherit;cursor:pointer;border:0;color:inherit;background:white;touch-action:manipulation}button:focus-visible{outline:3px solid var(--blue);outline-offset:4px}button:disabled{cursor:default;opacity:.35}button:not(:disabled):hover{filter:brightness(.97)}[hidden]{display:none!important}.brand{height:100px;display:flex;align-items:center;gap:12px;max-width:1600px;margin:auto;padding:0 64px;font-size:20px;font-weight:650}.brandmark{font-size:36px;color:var(--blue);line-height:1}.edition{font-size:11px;letter-spacing:.2em;font-weight:550;color:var(--muted);margin-left:12px}.lobby{min-height:calc(100dvh - 180px);max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;align-content:center;gap:100px;padding:50px 24px}.eyebrow{font-size:14px;color:var(--blue);font-weight:650}.intro h1{font-size:58px;font-weight:650;letter-spacing:-.065em;line-height:1.35;margin:26px 0}.intro p{font-size:17px;color:var(--muted)}.levels{display:flex;flex-direction:column;gap:14px}.levels button{min-height:84px;padding:0 26px;display:flex;align-items:center;gap:24px;border-radius:16px;font-size:21px;text-align:left;transition:transform .16s,box-s  0 0 0 3px var(--blue);z-index:2}.pencil-grid{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:5%;font-size:2.1cqw;color:#7385a1}.pencil-grid span{display:flex;align-items:center;justify-content:center}.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.pad button{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:28px;color:var(--blue);transition:background .12s}.pad button.action{background:#eaf0fb}.pad button.active{background:var(--blue);color:white}.pad svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.7}dialog{border:0;border-radius:24px;padding:40px;width:430px;max-width:calc(100vw - 32px);color:var(--ink);background:var(--bg);text-align:center;box-shadow:0 28px 100px #14264730}dialog::backdrop{background:#15213d70;backdrop-filter:blur(3px)}dialog h2{font-size:28px;margin:16px 0}dialog p{font-size:15px;color:var(--muted);line-height:1.6}.result-mark{margin:auto;width:52px;height:52px;border-radius:50%;background:#e2eaff;color:var(--blue);font-size:30px;display:grid;place-items:center}.clear-time{font-size:52px;color:var(--blue);font-variant-numeric:tabular-nums;font-weight:650;margin:24px 0 30px}.result-actions{display:grid;gap:10px}.result-actions button,.confirm-actions button,.ended button{min-height:52px;border-radius:12px;font-size:17px;padding:12px 24px}.primary{background:var(--blue);color:white}.confirm-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:26px}.ended{text-align:center;padding:20dvh 24px}.ended h1{font-size:34px;margin:24px 0 36px}@media(min-width:1500px) and (min-height:950px){.game{margin-top:25px}.play-layout{gap:80px;grid-template-columns:760px 328px}.gamehead{max-width:760px}}@media(max-width:1050px){.brand{height:76px;padding:0 28px}.lobby{gap:40px}.intro h1{font-size:44px}.play-layout{grid-template-columns:minmax(0,620px) 250px;ga </style></head>
<body><header class="brand"><span class="brandmark" aria-hidden="true">▦</span><span>스도쿠</span><span class="edition">QUIET GRID</span></header><main>
<section id="lobby" class="lobby"><div class="intro"><span class="eyebrow">S U D O K U</span><h1>한 칸씩,<br>나만의 속도로.</h1><p>오늘의 난이도를 선택하세요.</p></div><div class="levels"><button data-level="0"><span class="level-number">01</span><span>쉬움</span><span class="difficulty" aria-hidden="true">● ○ ○ ○</span></button><button data-level="1"><span class="level-number">02</span><span>보통</span><span class="difficulty" aria-hidden="true">● ● ○ ○</span></button><button data-level="2"><span class="level-number">03</span><span>어려움</span><span class="difficulty" aria-hidden="true">● ● ● ○</span></button><button data-level="3"><span class="level-number">04</span><span>아주 어려움</span><span class="difficulty" aria-hidden="true">● ● ● ●</span></button><button id="resume" class="resume" hidden>이어서 하기</button><p id="loading" role="status" hidden>퍼즐 준비 중…</p></div></section>
<section id="game" class="game" hidden><div class="gamehead"><button id="back" class="plain">로비</button><h1 id="level-label">쉬움</h1><span id="timer" class="timer" aria-label="플레이 타임">00:00</span></div><div class="play-layout"><div id="board" class="board" role="grid" aria-label="스도쿠 게임판"></div><aside class="controls"><div class="pad" id="pad"></div></aside></div></section>
<section id="ended" class="ended" hidden><span class="eyebrow">S U D O K U</span><h1>게임을 종료했어요.</h1><button id="return" class="primary">로비 가기</button></section></main>
<dialog id="result"><div class="result-mark" aria-hidden="true">✓</div><h2>성공했어요!</h2><p><span id="result-level"></span> · 클리어 타임</p><div id="clear-time" class="clear-time"></div><div class="result-actions"><button id="restart" class="primary">재시작</button><button id="result-lobby">로비 가기</button><button id="quit" class="plain">게임 종료</button></div></dialog>
<dialog id="confirm"><h2>새 게임을 시작할까요?</h2><p>진행 중인 게임이 새 게임으로 바뀝니다.</p><div class="confirm-actions"><button id="cancel-new">취소</button><button id="accept-new" class="primary">시작</button></div></dialog>
<script type="module">const LEVELS=['쉬움','보통','어려움','아주 어려움'];
function candidates(a,i){let mask=1022,r=Math.floor(i/9),c=i%9;for(let k=0;k<9;k++){mask&=~(1<<a[r*9+k]);mask&=~(1<<a[k*9+c]);}for(let y=Math.floor(r/3)*3;y<Math.floor(r/3)*3+3;y++)for(let x=Math.floor(c/3)*3;x<Math.floor(c/3)*3+3;x++)mask&=~(1<<a[y*9+x]);return mask;}
function next(a){let best=-1,count=10;for(let i=0;i<81;i++)if(!a[i]){let mask=candidates(a,i),n=0;while(mask){mask&=mask-1;n++;}if(n<count){best=i;count=n;if(n<2)break;}}return best;}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function solve(a,random=false){let i=next(a);if(i<0)return true;let mask=candidates(a,i),nums=[1,2,3,4,5,6,7,8,9];if(random)shuffle(nums);for(let n of nums)if(mask&(1<<n)){a[i]=n;if(solve(a,random))return true;}a[i]=0;return false;}
function countSolutions(a,limit=2){let i=next(a);if(i<0)return 1;let mask=candidates(a,i),total=0;for(let n=1;n<=9;n++)if(mask&(1<<n)){a[i]=n;total+=countSolutions(a,limit-total);if(total>=limit)break;}a[i]=0;return total;}
function generate(level){const solution=Array(81).fill(0);solve(solution,true);let best=solution.slice(),target=[42,35,29,25][level];for(let attempt=0;attempt<12;attempt++){let given=solution.slice(),count=81;for(let i of shuffle(Array.from({length:81},(_,i)=>i))){let old=given[i];given[i]=0;if(countSolutions(given.slice())===1)count--;else given[i]=old;if(count===target)return{given,solution};}if(given.filter(Boolean).length<best.filter(Boolean).length)best=given;}return{given:best,solution};}

const $=id=>document.getElementById(id),key='quiet-grid-sudoku-v1';let state=null,screen='lobby',started=0,pendingLevel=0,busy=false;
try{const s=JSON.parse(localStorage.getItem(key));if(s&&[s.given,s.values,s.notes].every(a=>Array.isArray(a)&&a.length===81)&&s.given.every(v=>Number.isInteger(v)&&v>=0&&v<=9)&&s.values.every(v=>Number.isInteger(v)&&v>=0&&v<=9)&&s.notes.every(v=>Number.isInteger(v)&&v>=0&&v<=1022)&&Number.isInteger(s.level)&&s.level>=0&&s.level<4&&Number.isFinite(s.elapsed)&&s.elapsed>=0){s.solution=s.given.slice();if(solve(s.solution)){s.selected=Number.isInteger(s.selected)&&s.selected>=0&&s.selected<81?s.selected:-1;s.history=Array.isArray(s.history)?s.history.slice(-300):[];state=s;}}}catch{}
const now=()=>performance.now();const total=()=>state?state.elapsed+(started?now()-started:0):0;
function time(ms=total()){let s=Math.floor(ms/1000);return(s>=3600?Math.floor(s/3600)+':':'')+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function save(){if(!state)return;try{localStorage.setItem(key,JSON.stringify({...state,elapsed:total()}));}catch{}}
function pause(){if(started){state.elapsed+=now()-started;started=0;}save();}
function resume(){if(screen==='game'&&state&&!state.finished&&!document.hidden&&!started)started=now();}
function show(name){pause();screen=name;for(let id of ['lobby','game','ended'])$(id).hidden=id!==name;$('resume').hidden=!state||state.finished;if(name==='game'){render();resume();}}
async function start(level){if(busy)return;busy=true;$('loading').hidden=false;document.querySelectorAll('[data-level]').forEach(b=>b.disabled=true);await new Promise(r=>setTimeout(r,40));try{let puzzle=generate(level);pause();state={...puzzle,values:puzzle.given.slice(),notes:Array(81).fill(0),level,selected:-1,memo:false,finished:false,checkErrors:false,elapsed:0,history:[]};save();show('game');}finally{busy=false;$('loading').hidden=true;document.querySelectorAll('[data-level]').forEach(b=>b.disabled=false);}}
function requestStart(level){if(state&&!state.finished){pendingLevel=level;pause();$('confirm').showModal();}else start(level);}
const cells=[];for(let i=0;i<81;i++){let b=document.createElement('button');b.className='cell';b.setAttribute('role','gridcell');b.addEventListener('click',()=>select(i));$('board').append(b);cells.push(b);}
function select(i){if(!state||screen!=='game')return;state.selected=i;render();save();}
const paths=['<path d="m3 13 8-8q1-1 2 0l7 7q1 1 0 2l-6 6H9zM8 8l9 9m-4 3h9"/>','<path d="m8 5-5 5 5 5M3 10h11c9 0 9 11 0 11"/>','<path d="m4 16 11-11q1-1 2 0l3 3-11 11-6 2zm9-9 5 5M4 16l5 3"/>'];
for(let r=0;r<3;r++)for(let c=0;c<4;c++){let b=document.createElement('button');if(c<3){let n=r*3+c+1;b.textContent=n;b.setAttribute('aria-label','숫자 '+n);b.onclick=()=>input(n);}else{let id=['erase','undo','memo'][r];b.id=id;b.className='action';b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true">'+paths[r]+'</svg>';b.setAttribute('aria-label',['지우기','되돌리기','메모'][r]);b.onclick=[erase,undo,toggleMemo][r];}$('pad').append(b);}
function render(){if(!state)return;const s=state,sel=s.selected,n=sel>=0?s.values[sel]:0;cells.forEach((b,i)=>{const v=s.values[i],wrong=s.checkErrors&&v!==0&&v!==s.solution[i];b.className='cell'+(s.given[i]?' given':'')+(sel>=0&&(Math.floor(i/9)===Math.floor(sel/9)||i%9===sel%9)?' cross':'')+(n&&v===n?' same':'')+(i===sel?' selected':'')+(wrong?' wrong':'');b.tabIndex=i===(sel<0?0:sel)?0:-1;b.setAttribute('aria-selected',String(i===sel));b.setAttribute('aria-label',`${Math.floor(i/9)+1}행 ${i%9+1}열, ${v||'빈칸'}${s.given[i]?', 고정 숫자':''}${wrong?', 오답':''}`);b.replaceChildren();if(v)b.textContent=v;else if(s.notes[i]){let grid=document.createElement('span');grid.className='pencil-grid';for(let n=1;n<=9;n++){let t=document.createElement('span');if(s.notes[i]&(1<<n))t.textContent=n;grid.append(t);}b.append(grid);}});$('memo').classList.toggle('active',s.memo);$('memo').setAttribute('aria-pressed',String(s.memo));$('undo').disabled=!s.history.length||s.finished;$('erase').disabled=!editable()||(!s.values[sel]&&!s.notes[sel]);$('memo').disabled=s.finished;$('level-label').textContent=LEVELS[s.level];$('timer').textContent=time();}
function editable(){return state&&screen==='game'&&!state.finished&&state.selected>=0&&!state.given[state.selected];}
function remember(){state.history.push({values:state.values.slice(),notes:state.notes.slice()});if(state.history.length>300)state.history.shift();}
function input(n){if(!editable())return;let s=state,i=s.selected;if(s.memo&&s.values[i]||!s.memo&&s.values[i]===n)return;remember();if(s.memo)s.notes[i]^=1<<n;else{s.values[i]=n;s.notes[i]=0;for(let j=0;j<81;j++)if(Math.floor(i/9)===Math.floor(j/9)||i%9===j%9||(Math.floor(i/27)===Math.floor(j/27)&&Math.floor(i%9/3)===Math.floor(j%9/3)))s.notes[j]&=~(1<<n);}changed();}
function erase(){if(!editable())return;let i=state.selected;if(!state.values[i]&&!state.notes[i])return;remember();state.values[i]=0;state.notes[i]=0;changed();}
function undo(){if(!state||state.finished||!state.history.length)return;let h=state.history.pop();state.values=h.values;state.notes=h.notes;changed();}
function toggleMemo(){if(!state||state.finished)return;state.memo=!state.memo;render();save();}
function changed(){let s=state;if(s.values.every(Boolean))s.checkErrors=true;if(s.values.every((v,i)=>v===s.solution[i])){pause();s.finished=true;$('clear-time').textContent=time();$('result-level').textContent=LEVELS[s.level];$('result').showModal();}render();save();}
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>requestStart(+b.dataset.level));$('resume').onclick=()=>show('game');$('back').onclick=()=>show('lobby');$('return').onclick=()=>show('lobby');$('cancel-new').onclick=()=>{$('confirm').close();resume();};$('accept-new').onclick=()=>{$('confirm').close();start(pendingLevel);};$('confirm').addEventListener('cancel',resume);$('restart').onclick=()=>{$('result').close();start(state.level);};$('result-lobby').onclick=()=>{$('result').close();show('lobby');};$('quit').onclick=()=>{$('result').close();show('ended');};$('result').addEventListener('cancel',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if(screen!=='game'||document.querySelector('dialog[open]')||busy)return;let k=e.key;if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();return;}if(e.ctrlKey||e.metaKey||e.altKey)return;if(/^[1-9]$/.test(k)){e.preventDefault();input(+k);}else if(k==='Backspace'||k==='Delete'||k==='0'){e.preventDefault();erase();}else if(k.toLowerCase()==='n'){e.preventDefault();toggleMemo();}else if(k.startsWith('Arrow')){e.preventDefault();let i=state.selected<0?0:state.selected,r=Math.floor(i/9),c=i%9;if(k==='ArrowLeft')c=Math.max(0,c-1);if(k==='ArrowRight')c=Math.min(8,c+1);if(k==='ArrowUp')r=Math.max(0,r-1);if(k==='ArrowDown')r=Math.min(8,r+1);select(r*9+c);cells[state.selected].focus();}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();else resume();});window.addEventListener('pagehide',pause);setInterval(()=>{if(screen==='game')$('timer').textContent=time();},250);setInterval(save,5000);show('lobby');
if(document.modelContext?.registerTool){const controller=new AbortController();window.addEventListener('pagehide',()=>controller.abort(),{once:true});for(const tool of [{name:'read_sudoku_game',description:'Read the visible Sudoku game and current selection without revealing the solution.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:false},execute:()=>({screen,level:state?LEVELS[state.level]:null,values:state?.values,given:state?.given,notes:state?.notes,selected:state?.selected,memo:state?.memo,finished:state?.finished})},{name:'enter_sudoku_number',description:'Select an editable cell and enter a digit using the current number or memo mode.',inputSchema:{type:'object',properties:{row:{type:'integer',minimum:1,maximum:9},column:{type:'integer',minimum:1,maximum:9},number:{type:'integer',minimum:1,maximum:9}},required:['row','column','number'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:args=>{if(!args||![args.row,args.column,args.number].every(n=>Number.isInteger(n)&&n>=1&&n<=9))throw Error('row, column and number must be integers from 1 to 9');let i=(args.row-1)*9+args.column-1;if(screen!=='game'||!state||state.finished||state.given[i]||document.querySelector('dialog[open]'))throw Error('Cell is not editable');select(i);input(args.number);return{row:args.row,column:args.column,value:state.values[i],notes:state.notes[i],finished:state.finished};}}])try{Promise.resolve(document.modelContext.registerTool(tool,{signal:controller.signal})).catch(()=>{});}catch{}}
</script></body></html>
